name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X 'github.com/kreulenk/mongotui/internal/build.Version=latest' -X 'github.com/kreulenk/mongotui/internal/build.SHA=${GITHUB_SHA}'" -o mongotui .
          tar -czvf mongotui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz mongotui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongotui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mongotui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA:0:7})" \
            --notes "Automated build of main at ${GITHUB_SHA}."
